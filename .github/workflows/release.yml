name: Release

# Tag vX.Y.Z → build plugin.wasm, stamp its sha256 into filex-app.json,
# and attach plugin.wasm + filex-app.json + plugin.wasm.sha256 to the
# GitHub release. filex installs from `BRF-Tech/filex-sign@vX.Y.Z`: it reads
# filex-app.json from the tag, follows wasm.url ({tag} = the tag) and checks
# wasm.sha256 against what it downloaded. The release's notes are the
# version's CHANGELOG.md section: what filex shows an administrator when it
# offers the update.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The compiler scripts/build.sh forces, so the tests and the build here
      # are the ones a release runs (go.mod `toolchain`).
      - name: Use the toolchain go.mod pins
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"
      - name: test
        run: go test ./... -count=1
      - name: version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c "import json; print(json.load(open('filex-app.json', encoding='utf-8'))['version'])")"
          test "$TAG" = "$VER" || { echo "filex-app.json version $VER != tag $TAG"; exit 1; }
      - name: build + stamp sha256
        run: bash scripts/build.sh --stamp
      # filex-app.json at the tag is what filex installs from, and it carries
      # the module's sha256: the build here must give exactly that module, or
      # an install from the tag is refused (sha256_mismatch). --stamp above
      # rewrote the file with this build's hash, so any difference is one.
      - name: the committed sha256 is this build's
        run: |
          git diff --exit-code -- filex-app.json || { echo "filex-app.json at the tag does not carry this build's sha256 - run bash scripts/build.sh --stamp, commit, tag again"; exit 1; }
      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[?"v { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then echo "Release $GITHUB_REF_NAME" > /tmp/notes.md; fi
          cat /tmp/notes.md
      - name: release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: /tmp/notes.md
          files: |
            dist/plugin.wasm
            dist/plugin.wasm.sha256
            dist/filex-app.json
