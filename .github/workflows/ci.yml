name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The compiler scripts/build.sh forces, so the tests and the build here
      # are the ones a release runs (go.mod `toolchain`).
      - name: Use the toolchain go.mod pins
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: build wasm (size gate)
        run: bash scripts/build.sh
      - name: manifest parses and matches the module
        run: |
          python3 -c "import json; m=json.load(open('filex-app.json', encoding='utf-8')); assert m['name']=='sign'; assert m['manifest_version']==1"
      # A stamped sha256 has to be the hash of what this tree builds, or the
      # release installs nothing. The build is reproducible on purpose (see
      # scripts/build.sh), so a stale stamp is a real mismatch, not noise.
      - name: a stamped sha256 must match the module
        run: |
          WANT="$(python3 -c "import json; print(json.load(open('filex-app.json', encoding='utf-8')).get('wasm', {}).get('sha256', ''))")"
          if [ -n "$WANT" ]; then
            GOT="$(cut -d' ' -f1 dist/plugin.wasm.sha256)"
            test "$WANT" = "$GOT" || { echo "filex-app.json wasm.sha256 $WANT != built $GOT - run bash scripts/build.sh --stamp and commit"; exit 1; }
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-wasm
          path: |
            dist/plugin.wasm
            dist/plugin.wasm.sha256
